<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmasi Klaim App V11</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .tab-active { border-bottom: 3px solid #0F5132; color: #0F5132; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">
    <header class="bg-[#0F5132] text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="font-bold text-lg leading-tight">Farmasi Klaim App V11</h1>
            <p class="text-xs text-emerald-200">Akumulasi Plafon & Summary P2X Gross (Rp)</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="syncAllData()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs px-2.5 py-2 rounded-lg flex items-center gap-1 shadow transition">
                🔄 Sync Cloud
            </button>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1 shadow transition">
                Export Excel
            </button>
        </div>
    </header>

    <!-- Global Period Selector Banner -->
    <div class="bg-emerald-900 text-white px-3 py-2.5 flex justify-between items-center text-xs shadow-inner gap-1 flex-wrap">
        <div class="flex items-center gap-1 font-medium">
            <span>Periode:</span>
        </div>
        <div class="flex items-center gap-1.5">
            <select id="global-year-select" onchange="changePeriod()" class="bg-emerald-800 border border-emerald-600 text-white font-bold rounded-md px-1.5 py-1 text-xs focus:outline-none cursor-pointer">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
            </select>
            <select id="global-month-select" onchange="changePeriod()" class="bg-emerald-800 border border-emerald-600 text-white font-bold rounded-md px-1.5 py-1 text-xs focus:outline-none cursor-pointer">
                <option value="Januari">Januari</option>
                <option value="Februari">Februari</option>
                <option value="Maret">Maret</option>
                <option value="April">April</option>
                <option value="Mei">Mei</option>
                <option value="Juni">Juni</option>
                <option value="Juli" selected>Juli</option>
                <option value="Agustus">Agustus</option>
                <option value="September">September</option>
                <option value="Oktober">Oktober</option>
                <option value="November">November</option>
                <option value="Desember">Desember</option>
            </select>
            <select id="global-cutoff-select" onchange="changePeriod()" class="bg-emerald-800 border border-emerald-600 text-white font-bold rounded-md px-1.5 py-1 text-xs focus:outline-none cursor-pointer">
                <option value="Cut Off 1" selected>Cut Off 1</option>
                <option value="Cut Off 2">Cut Off 2</option>
                <option value="Semua CO (CO1+CO2)">Semua CO (CO1+CO2)</option>
            </select>
        </div>
    </div>

    <!-- Main Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around z-50 shadow-lg text-[11px]">
        <button onclick="switchTab('transaksi')" id="nav-transaksi" class="flex-1 py-3 text-center text-slate-500 tab-active flex flex-col items-center">Input Dokter</button>
        <button onclick="switchTab('outlet')" id="nav-outlet" class="flex-1 py-3 text-center text-slate-500 flex flex-col items-center">Stok Outlet</button>
        <button onclick="switchTab('plafon')" id="nav-plafon" class="flex-1 py-3 text-center text-slate-500 flex flex-col items-center">Rekap Dokter</button>
        <button onclick="switchTab('summary')" id="nav-summary" class="flex-1 py-3 text-center text-slate-500 flex flex-col items-center">Summary</button>
        <button onclick="switchTab('master')" id="nav-master" class="flex-1 py-3 text-center text-slate-500 flex flex-col items-center">Master Data</button>
    </nav>

    <main class="p-4 max-w-lg mx-auto">
        <!-- TAB 1: INPUT TRANSAKSI DOKTER -->
        <section id="tab-transaksi" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-bold text-slate-700 text-sm" id="form-doc-title">Form Penulisan Dokter</h2>
                    <span class="text-[11px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded" id="badge-period-transaksi">2026 - Juli - Cut Off 1</span>
                </div>
                <form id="form-dokter" onsubmit="addPenulisanDokter(event)" class="space-y-3">
                    <input type="hidden" id="edit-trans-id" value="-1">
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">Nama Dokter Target</label>
                        <input type="text" id="input-doc-name" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white" placeholder="Masukkan nama dokter">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-slate-600 block mb-1">Outlet Tempat Penulisan</label>
                        <select id="input-doc-outlet" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Produk Obat</label>
                            <select id="input-doc-product" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50"></select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Qty (Box)</label>
                            <input type="number" id="input-doc-qty" min="1" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="1">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Status P2X</label>
                            <select id="input-doc-p2x" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-slate-50">
                                <option value="P2X">P2X</option>
                                <option value="Existing">Non-P2X / Existing</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-600 block mb-1">Insentif Dokter (Rp)</label>
                            <input type="number" id="input-doc-insentif" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" placeholder="e.g. 50000">
                        </div>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="button" id="btn-cancel-trans" onclick="resetTransForm()" class="hidden flex-1 bg-slate-200 text-slate-700 font-semibold py-3 rounded-lg text-sm transition">Batal</button>
                        <button type="submit" id="btn-save-trans" class="flex-1 bg-[#0F5132] hover:bg-emerald-800 text-white font-semibold py-3 rounded-lg shadow text-sm transition">Simpan Penulisan Dokter</button>
                    </div>
                </form>
            </div>

            <!-- Interactive Table -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="font-bold text-slate-700 text-sm">Data Penulisan Periode Ini</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase font-mono text-[10px]">
                                <th class="p-2 border">Dokter</th>
                                <th class="p-2 border">Outlet</th>
                                <th class="p-2 border">Produk</th>
                                <th class="p-2 border">Qty</th>
                                <th class="p-2 border">Insentif</th>
                                <th class="p-2 border">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="render-transaksi-rows">
                            <tr><td colspan="6" class="text-center p-4 text-slate-400">Loading data dari cloud...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 2: INPUT STOK OUTLET -->
        <section id="tab-outlet" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-3">
